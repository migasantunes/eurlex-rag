name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run every Python version to the end, even if one fails, to see them all.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev,serve]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Tests marked "slow" need a model download, a database or the network.
      - name: Tests
        run: pytest -m "not slow"

      # The retrieval smoke-eval gate (docs/EVAL.md §6: ~30 dev queries, fail the
      # build if Recall@5 drops below the committed threshold) is added in
      # milestone M3, once the benchmark exists.
